name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: pitline-corner-frontend/package-lock.json
    
    - name: Install dependencies
      run: cd pitline-corner-frontend && npm ci
    
    - name: Run type check
      run: cd pitline-corner-frontend && npm run type-check
    
    - name: Run lint
      run: cd pitline-corner-frontend && npm run lint
    
    - name: Run tests
      run: cd pitline-corner-frontend && npm test
    
    - name: Build
      run: cd pitline-corner-frontend && npm run build
